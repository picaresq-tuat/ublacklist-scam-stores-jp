# スコア重み定義 (P4)。scorer.py はこのファイルのみを重みの源とする (ハードコード禁止)。
version: 1
weights:
  redirect_to_google: 35      # 検索エンジンへのドアウェイ転送 (実測: *.hika-jp.casa 17 件)
  favicon_collision: 30       # 既知詐欺コーパスと favicon md5 一致 (実測: 17 件が同一)
  favicon_cross_origin: 5     # クロスオリジン favicon 一致 (低重み; サブドメイン/汎用は除く)
  zencart: 10                 # ZenCart 構造マーカー >= zencart_min_hits (補助シグナルのみ。S3 スパイクで
                              # 正規 ZenCart 店 (cms-server.ne.jp=2, shop.obitastar.co.jp=3) が
                              # 2-3 ヒットするため単独 auto_block 不可: 10 < hold 12)
  bot_only_body: 20           # Googlebot にのみ本文を返す
  cloaking: 12                # title 差 かつ 本文長比 >= 0.3 (status 差を伴う場合は promoted)
  cloaking_promoted: 20
  stolen_image: 15            # 商品画像 src が WH ストアのホスト
  dark_pattern_per_hit: 3
  dark_pattern_cap: 9
  risky_tld: 8
  shared_2ld: 6
  offsite_redirect: 10
  deep_product_path: 2
  young_index: 5
  # --- T3: RDAP / whois 特徴量 (S5 実測 2026-10) ---
  # 実測コーパス: legit 18 件 (.jp は rdap.org 非対応で RDAP 0 件) / scam 30 件。
  #   RDAP 取得成功: legit 2/18, scam 12/30
  #   registrar URL TLD != com/jp: legit 1/2 (dynabook.com) → maker 例外で除外後 0/2,
  #                                 scam 11/12 = 91.7% (0/18 の全 legit で 0%)
  #   abuse 電話 cc != 81:         legit 1/2 (dynabook +49) → 例外後 0/2, scam 4/12 = 33.3%
  #   rdap_slow (>3s):             legit 0/2, scam 0/12 → 判別力なし。weight 0 (計測のみ)。
  # 単独では hold(12) 未満に抑え、既存シグナルの補強のみ (precision 優先)。
  # 正規店 RDAP 発火率 0/18、scam 加算は 11/30 件 (中央値 +6)。
  # 注意: scam の registrar URL 11 件中 10 件は `rdap.registry.click` (レジストリの
  # RDAP エンドポイント) を指す。よって本シグナルが測るのは「レジストラの国籍」ではなく
  # 「registrar entity のリンク先ホストの TLD」= 安価な新規 TLD レジストリ基盤の検出に近い。
  # 将来 .uk/.de の RDAP を指す正規ブランドが出た場合は allow-list (KNOWN_FOREIGN_MAKERS)
  # を URL TLD ではなくドメイン/レジストラ名で判定する必要がある。
  rdap_slow: 0                # 3 秒超。実測で両クラス 0 件のため計測用 (重み 0)
  registrar_url_tld_foreign: 6  # 実測 scam 91.7% / 正規店 0%。hold 未満の補助シグナル
  abuse_phone_foreign: 4      # 実測 scam 33.3% / 正規店 0%。欠損は加算しない
thresholds:
  rdap_slow_ms: 3000          # RDAP 取得時間の「遅い」閾値 (features は生 ms のみ保持)
  auto_block: 30              # 実測: recall 19/20, FP 0/20
  hold: 12                    # 2 段構えの保留域
  fast_track: 60              # 連続 2 夜を待たずに登録
  zencart_min_hits: 2         # 補助重みのため min_hits=2 でも単独では hold 未満 (precision 優先)
  nights_required: 2
pivot:
  max_queries: 4
  hold_trigger: 12
