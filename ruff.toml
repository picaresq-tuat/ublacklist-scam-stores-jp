# ruff 設定 (https://docs.astral.sh/ruff/)
# 実行: ruff check . && ruff format --check .
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "RUF", # ruff 独自ルール
]
ignore = [
    "E501", # 行長はフォーマッタに委ねる
    "B008", # 関数呼び出しを既定引数に置くのは許容
    "RUF001", "RUF002", "RUF003", # 日本語コメント/文字列の全角記号を許容
    "RUF005", # リスト連結よりアンパックを推奨するが既存記述を維持
]

[lint.per-file-ignores]
# テストは意図的に未使用の戻り値・緩い比較を書く
"tests/*" = ["B011", "E402"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
